name: Kombo City Factory

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Generate a new Short or publish the latest saved video"
        required: true
        type: choice
        options:
          - generate_and_publish
          - publish_latest
        default: generate_and_publish
  schedule:
    # Four independent production slots per day; no exact-clock guard.
    - cron: "0 6,10,14,18 * * *"

permissions:
  contents: write

concurrency:
  group: kombo-city-factory-daily
  cancel-in-progress: false

jobs:
  build-one-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kombo-city-factory
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kombo-city-factory/requirements.txt

      - name: Install and verify media tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              echo "Installing FFmpeg (attempt $attempt/3)"
              if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not install FFmpeg/FFprobe after 3 attempts."
                exit 1
              fi
              sleep 5
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py

      - name: Generate and validate one video
        id: build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'publish_latest' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Add GEMINI_API_KEY in Actions secrets."; exit 1; }
          test -n "$FISH_API_KEY" || { echo "::error::Add FISH_API_KEY in Actions secrets."; exit 1; }
          test -n "$FISH_VOICE_ID" || { echo "::error::Add FISH_VOICE_ID in Actions secrets."; exit 1; }
          test -n "$POLLINATIONS_API_KEY" || { echo "::error::Add POLLINATIONS_API_KEY in Actions secrets. Pollinations image generation now requires an authenticated key with available balance."; exit 1; }
          python main.py --one

      - name: Select latest saved video for publishing
        id: latest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'publish_latest' }}
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          out = Path("kombo-city-factory/output")
          candidates = sorted(out.glob("*.mp4"), key=lambda p: p.name, reverse=True)
          for video in candidates:
              meta = video.with_suffix(".json")
              receipt = video.with_suffix(".youtube.json")
              if meta.exists() and not receipt.exists():
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                      f.write(f"video={video.as_posix()}\n")
                      f.write(f"metadata={meta.as_posix()}\n")
                  print(f"Selected saved video (newest filename timestamp, no YouTube receipt): {video}")
                  break
          else:
              raise SystemExit("No unpublished saved MP4 with matching metadata was found.")
          PY

      - name: Publish Short to رواة الواقع on YouTube
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.latest.outcome == 'success') }}
        working-directory: .
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YOUTUBE_EXPECTED_HANDLE: RowatAlwaqe
          VIDEO_PATH: ${{ steps.build.outputs.video || steps.latest.outputs.video }}
          METADATA_PATH: ${{ steps.build.outputs.metadata || steps.latest.outputs.metadata }}
        run: |
          set -euo pipefail
          test -n "$YT_TOKEN_JSON" || { echo "::error::Add YT_TOKEN_JSON (Google OAuth token JSON for @RowatAlwaqe) to repository Actions secrets."; exit 1; }
          python kombo-city-factory/publish_youtube.py

      - name: Commit generated video and used-idea ledger
        if: always() && (steps.build.outcome == 'success' || steps.latest.outcome == 'success')
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kombo-city-factory/used.txt kombo-city-factory/output/
          if git diff --cached --quiet; then
            echo "No generated output to commit."
          else
            git commit -m "chore(kombo): save generated video and publishing receipt"
            # Rebase onto the latest main before pushing. Never force-push.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
