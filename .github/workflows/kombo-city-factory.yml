name: Kombo City Factory

on:
  push:
    branches: [main]
    paths:
      - "kombo-city-factory/inbox/**/scene_*.jpg"
      - "kombo-city-factory/trigger/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Generate a new Short or publish the latest saved video"
        required: true
        type: choice
        options:
          - prepare_images
          - render_pending
          - publish_latest
        default: prepare_images
  schedule:
    # Four Egypt-time slots (08:37, 12:37, 16:37, 20:37), offset from the hour to reduce schedule congestion.
    - cron: "37 6,10,14,18 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: kombo-city-factory-daily
  cancel-in-progress: false

jobs:
  build-one-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kombo-city-factory
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kombo-city-factory/requirements.txt

      - name: Validate YouTube OAuth JSON before installing dependencies
        id: oauth_payload
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.action == 'prepare_images') }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os, re, base64
          raw = os.getenv("YT_TOKEN_JSON", "").lstrip("\ufeff").strip()
          if not raw:
              raise SystemExit("YT_TOKEN_JSON is empty; stop before installing packages or calling Gemini/Fish.")
          if raw.lower().startswith("base64:"):
              raw = raw.split(":", 1)[1].strip()
          if not raw.startswith(("{", "[", "`", "HTTP/")):
              try:
                  decoded = base64.b64decode(raw + "=" * (-len(raw) % 4), validate=True).decode("utf-8-sig").strip()
                  if decoded.startswith(("{", "`", "HTTP/")):
                      raw = decoded
              except Exception:
                  pass
          if raw.startswith("HTTP/"):
              match = re.search(r"\r?\n\r?\n", raw)
              if match:
                  raw = raw[match.end():].strip()
          if raw.startswith("```"):
              raw = re.sub(r"\A```(?:json)?\s*|\s*```\Z", "", raw, flags=re.I).strip()
          try:
              info = json.loads(raw)
              if isinstance(info, str):
                  info = json.loads(info)
          except json.JSONDecodeError as first:
              start, end = raw.find("{"), raw.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit(f"YT_TOKEN_JSON is not valid JSON (line {first.lineno}, column {first.colno}); replace it with the full OAuth JSON response body. Secret content was not printed.")
              try:
                  info = json.loads(raw[start:end + 1])
              except json.JSONDecodeError as second:
                  raise SystemExit(f"YT_TOKEN_JSON is malformed JSON (line {second.lineno}, column {second.colno}); secret content was not printed.")
          if not isinstance(info, dict):
              raise SystemExit("YT_TOKEN_JSON must be a JSON object, not a plain token.")
          if not info.get("token") and info.get("access_token"):
              info["token"] = info["access_token"]
          info.setdefault("client_id", os.getenv("YT_CLIENT_ID", "").strip())
          info.setdefault("client_secret", os.getenv("YT_CLIENT_SECRET", "").strip())
          missing = [key for key in ("client_id", "client_secret", "refresh_token", "token") if not info.get(key)]
          if missing:
              raise SystemExit("OAuth JSON is missing: " + ", ".join(missing) + ". Secret content was not printed.")
          print("OAuth JSON structure: PASS (secret values hidden)")
          PY
      - name: Install and verify media tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              echo "Installing FFmpeg (attempt $attempt/3)"
              if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not install FFmpeg/FFprobe after 3 attempts."
                exit 1
              fi
              sleep 5
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py manual_pipeline.py publish_youtube.py

      - name: Live YouTube OAuth smoke test before Gemini/Fish generation
        id: oauth_smoke
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.action == 'prepare_images') }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YOUTUBE_EXPECTED_HANDLE: RowatAlwaqe
        run: |
          python - <<'PY'
          import json, os, re, base64
          from datetime import datetime, timedelta, timezone
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          raw = os.getenv("YT_TOKEN_JSON", "").lstrip("\ufeff").strip()
          if not raw:
              raise SystemExit("YT_TOKEN_JSON is empty; generation stopped before Gemini/Fish usage.")
          if raw.startswith("HTTP/"):
              match = re.search(r"\r?\n\r?\n", raw)
              if match:
                  raw = raw[match.end():].strip()
          if raw.startswith("```"):
              raw = re.sub(r"\A```(?:json)?\s*|\s*```\Z", "", raw, flags=re.I).strip()
          try:
              info = json.loads(raw)
              if isinstance(info, str):
                  info = json.loads(info)
          except json.JSONDecodeError as first:
              start, end = raw.find("{"), raw.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit(f"YT_TOKEN_JSON is malformed JSON (line {first.lineno}, column {first.colno}); secret content was not printed.")
              try:
                  info = json.loads(raw[start:end + 1])
              except json.JSONDecodeError as second:
                  raise SystemExit(f"YT_TOKEN_JSON is malformed JSON (line {second.lineno}, column {second.colno}); secret content was not printed.")
          if not isinstance(info, dict):
              raise SystemExit("YT_TOKEN_JSON must be a JSON object.")
          if not info.get("token") and info.get("access_token"):
              info["token"] = info["access_token"]
          info.setdefault("client_id", os.getenv("YT_CLIENT_ID", "").strip())
          info.setdefault("client_secret", os.getenv("YT_CLIENT_SECRET", "").strip())
          info.setdefault("token_uri", "https://oauth2.googleapis.com/token")
          if not info.get("scopes") and info.get("scope"):
              info["scopes"] = info["scope"].split()
          missing = [key for key in ("client_id", "client_secret", "refresh_token", "token") if not info.get(key)]
          if missing:
              raise SystemExit("OAuth JSON is missing: " + ", ".join(missing) + ". Secret content was not printed.")
          scopes = ["https://www.googleapis.com/auth/youtube.upload", "https://www.googleapis.com/auth/youtube.readonly"]
          if not info.get("expiry"):
              info["expiry"] = (datetime.now(timezone.utc) - timedelta(seconds=60)).isoformat()
          creds = Credentials.from_authorized_user_info(info, scopes=scopes)
          if creds.expired and creds.refresh_token:
              creds.refresh(Request())
          if not creds.valid:
              raise SystemExit("YouTube OAuth credentials are invalid; generation stopped before Gemini/Fish usage.")
          youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)
          result = youtube.channels().list(part="id,snippet", mine=True, maxResults=1).execute()
          channels = result.get("items", [])
          if not channels:
              raise SystemExit("OAuth returned no YouTube channel; generation stopped.")
          channel = channels[0]
          actual = channel.get("snippet", {}).get("customUrl", "").lstrip("@").casefold()
          expected = os.getenv("YOUTUBE_EXPECTED_HANDLE", "RowatAlwaqe").lstrip("@").casefold()
          if not actual or actual != expected:
              raise SystemExit("OAuth channel identity does not match @RowatAlwaqe; generation stopped.")
          print("YOUTUBE_OAUTH_SMOKE_TEST=PASS")
          print("YOUTUBE_CHANNEL_TITLE=" + channel.get("snippet", {}).get("title", "unknown"))
          PY

      - name: Prepare script and Gemini image prompts
        id: prepare
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'prepare_images' }}
        run: |
          python manual_pipeline.py --prepare

      - name: Render video from uploaded Gemini images
        id: render
        if: ${{ (github.event_name == 'schedule' && steps.pending.outputs.video == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[auto-generate]') && steps.pending.outputs.video == '') || (github.event_name == 'push' && (contains(toJSON(github.event.commits.*.added), 'kombo-city-factory/inbox/') || contains(toJSON(github.event.commits.*.modified), 'kombo-city-factory/inbox/'))) || (github.event_name == 'workflow_dispatch' && inputs.action == 'render_pending') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SCRIPT_MODEL: ${{ vars.GEMINI_SCRIPT_MODEL || 'gemini-2.5-flash' }}
          AUTO_GENERATE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[auto-generate]') }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$AUTO_GENERATE" = "true" ]; then
            test -n "$GEMINI_API_KEY" || { echo "::error::Add GEMINI_API_KEY in Actions secrets. Gemini API key is required for script generation; visual scenes are generated locally for free."; exit 1; }
            test -n "$FISH_API_KEY" || { echo "::error::Add FISH_API_KEY in Actions secrets."; exit 1; }
            test -n "$FISH_VOICE_ID" || { echo "::error::Add FISH_VOICE_ID in Actions secrets."; exit 1; }
            python main.py --one
          else
            test -n "$FISH_API_KEY" || { echo "::error::Add FISH_API_KEY in Actions secrets."; exit 1; }
            test -n "$FISH_VOICE_ID" || { echo "::error::Add FISH_VOICE_ID in Actions secrets."; exit 1; }
            python manual_pipeline.py --render-pending
          fi

      - name: Select pending video before new scheduled generation
        id: pending
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish_latest') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[auto-generate]')) }}
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          out = Path("kombo-city-factory/output")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("video=\nmetadata=\n")
          candidates = list(out.glob("*.mp4"))
          def timestamp(path):
              match = re.search(r"_(\d{8}_\d{6})\.mp4$", path.name)
              return match.group(1) if match else path.name
          # Scheduled runs drain the oldest pending upload first. Manual publish_latest
          # selects the newest pending video, matching the action's label.
          newest_first = os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch"
          candidates.sort(key=timestamp, reverse=newest_first)
          for video in candidates:
              metadata = video.with_suffix(".json")
              receipt = video.with_suffix(".youtube.json")
              if metadata.is_file() and not receipt.exists():
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                      f.write(f"video={video.as_posix()}\n")
                      f.write(f"metadata={metadata.as_posix()}\n")
                  print(f"Pending upload selected: {video.name}")
                  break
          else:
              print("No pending rendered video found; scheduled runs may generate the next idea.")
          PY

      - name: Publish Short to رواة الواقع on YouTube
        id: publish
        if: ${{ !cancelled() && (steps.render.outcome == 'success' || steps.pending.outputs.video != '') }}
        working-directory: .
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YOUTUBE_EXPECTED_HANDLE: RowatAlwaqe
          VIDEO_PATH: ${{ steps.pending.outputs.video || steps.render.outputs.video }}
          METADATA_PATH: ${{ steps.pending.outputs.metadata || steps.render.outputs.metadata }}
        run: |
          set -euo pipefail
          test -n "$YT_TOKEN_JSON" || { echo "::error::Add YT_TOKEN_JSON (Google OAuth token JSON for @RowatAlwaqe) to repository Actions secrets."; exit 1; }
          python kombo-city-factory/publish_youtube.py

      - name: Write production and publishing report
        if: always()
        env:
          VIDEO_PATH: ${{ steps.pending.outputs.video || steps.render.outputs.video }}
          METADATA_PATH: ${{ steps.pending.outputs.metadata || steps.render.outputs.metadata }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          OAUTH_JSON_OUTCOME: ${{ steps.oauth_payload.outcome }}
          OAUTH_LIVE_OUTCOME: ${{ steps.oauth_smoke.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          video = Path(os.getenv("VIDEO_PATH", ""))
          metadata = Path(os.getenv("METADATA_PATH", ""))
          receipt = video.with_suffix(".youtube.json") if str(video) not in ("", ".") else None
          lines = ["## Kombo City Factory — production report", ""]
          lines.append(f"- OAuth JSON validation: **{os.getenv('OAUTH_JSON_OUTCOME', 'not run')}**")
          lines.append(f"- Live YouTube channel check: **{os.getenv('OAUTH_LIVE_OUTCOME', 'not run')}**")
          lines.append(f"- Render step: **{os.getenv('RENDER_OUTCOME', 'not run')}**")
          lines.append(f"- Publish step: **{os.getenv('PUBLISH_OUTCOME', 'not run')}**")
          if metadata and metadata.is_file():
              data = json.loads(metadata.read_text(encoding="utf-8"))
              lines += [f"- Idea: **#{data.get('idea_id', 'unknown')} — {data.get('idea', 'unknown')}**",
                        f"- Title: **{data.get('title', 'unknown')}**",
                        f"- Duration target: **{data.get('duration_seconds', 'unknown')} seconds**"]
          if video and video.is_file():
              lines.append(f"- MP4: **{video.name} ({video.stat().st_size / 1048576:.2f} MB)**")
          if receipt and receipt.is_file():
              data = json.loads(receipt.read_text(encoding="utf-8"))
              lines += [f"- YouTube: **{data.get('verification', 'uploaded, not verified')}**",
                        f"- Video ID: **{data.get('video_id', 'unknown')}**",
                        f"- URL: {data.get('url', 'not available')}"]
          else:
              lines.append("- YouTube verification: **not confirmed in this run**")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Commit generated video and used-idea ledger
        if: always() && (steps.prepare.outcome == 'success' || steps.render.outcome == 'success' || steps.pending.outputs.video != '')
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kombo-city-factory/used.txt kombo-city-factory/output/ kombo-city-factory/pending/ kombo-city-factory/inbox/
          if git diff --cached --quiet; then
            echo "No generated output to commit."
          else
            git commit -m "chore(kombo): save generated video and publishing receipt"
            # Rebase onto the latest main before pushing. Never force-push.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Notify owner through a deduplicated GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[Factory Alert] Kombo City Factory failure"
          existing="$(gh issue list --state open --search "in:title [Factory Alert] Kombo City Factory failure" --json number --jq '.[0].number // empty')"
          body="$(printf 'The automated production workflow failed.\n\nRun: %s\n\nThis issue is updated instead of creating a new alert for every retry.' "$RUN_URL")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
