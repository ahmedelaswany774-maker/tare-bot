name: Story Bot - Series Publisher
on:
  # الجدولة متوقفة مؤقتًا حتى يكتمل سجل الحلقات المنشورة ومنع التكرار.
  workflow_dispatch:
    inputs:
      series:
        description: 'السلسلة المطلوب استكمالها'
        required: true
        default: room_17
        type: choice
        options:
          - room_17
          - real_stories
      episode_number:
        description: 'next لأول حلقة غير منشورة، أو رقم حلقة من السلسلة المختارة'
        required: true
        default: next
        type: choice
        options:
          - next
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      preview_only:
        description: 'إنتاج معاينة فقط بدون رفعها إلى YouTube'
        required: true
        default: true
        type: boolean
      tts_backend:
        description: 'محرك الصوت: edge مجاني، أو xtts بصوتك، أو fish'
        required: true
        default: edge
        type: choice
        options:
          - edge
          - xtts
          - fish
      publish_short:
        description: 'نشر الـShort المرتبط بعد تجهيز الفيديو الطويل'
        required: true
        default: false
        type: boolean
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: story-${{ inputs.series }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy edge-tts requests kaggle fish-audio-sdk
      - name: Install XTTS backend
        if: ${{ (inputs.tts_backend || 'edge') == 'xtts' }}
        run: pip install torch torchaudio torchcodec 'transformers==4.57.1' coqui-tts soundfile
      - name: Decode private voice reference
        if: ${{ (inputs.tts_backend || 'edge') == 'xtts' }}
        env:
          VOICE_REFERENCE_B64: ${{ secrets.VOICE_REFERENCE_B64 }}
        run: |
          test -n "$VOICE_REFERENCE_B64"
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > voice_reference.ogg
          ffmpeg -y -i voice_reference.ogg -ac 1 -ar 24000 -c:a pcm_s16le voice_reference.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice_reference.wav
      - name: Remove stale generated outputs
        run: rm -f story.mp3 story.mp4 story_metadata.json upload_state.json story_short.mp4 short_state.json story.txt
      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-2.5-flash,gemini-2.5-flash-lite
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          SERIES_MANIFEST_PATH: content/series/${{ inputs.series || 'room_17' }}.json
          GROWTH_POLICY_PATH: content/strategy/growth_policy.json
          EPISODE_NUMBER: ${{ inputs.episode_number }}
          PREVIEW_ONLY: ${{ inputs.preview_only != false }}
          TTS_BACKEND: ${{ inputs.tts_backend || 'edge' }}
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '30'
        run: python -u story_youtube_uploader.py
      - name: Persist published episode
        if: ${{ success() && inputs.preview_only == false }}
        env:
          SERIES_MANIFEST_PATH: content/series/${{ inputs.series || 'room_17' }}.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SERIES_MANIFEST_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record published episode"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Publish linked Short
        if: ${{ inputs.publish_short == true && inputs.preview_only == false }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python short_youtube_uploader.py
      - name: Verify generated video exists
        if: always()
        run: test -f story.mp4 && test -f story_metadata.json && test -f upload_state.json && ls -lh story.mp4
      - name: Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: story-${{ github.run_id }}
          path: |
            story.mp4
            story.mp3
            story.txt
            story_metadata.json
            upload_state.json
            content/series/*.json
          if-no-files-found: ignore
          retention-days: 90
