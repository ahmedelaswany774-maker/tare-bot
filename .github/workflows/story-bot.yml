name: Story Bot - Episode Video Production and YouTube Publishing
# Four daily production slots (Egypt winter time: 10:00, 13:00, 16:00, 19:00).
# Each slot uploads the next eligible, locally scripted episode; no Gemini drafting.

on:
  schedule:
    - cron: '0 8,11,14,17 * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/story-bot.yml"
      - "story_youtube_uploader.py"
      - "content/drafts/**"
      - "content/series/real_stories.json"
  workflow_dispatch:
    inputs:
      episode_mode:
        description: "نوع الإنتاج"
        required: true
        default: verified_real_story
        type: choice
        options:
          - verified_real_story
      episode_number:
        description: "رقم الحلقة داخل السلسلة المختارة"
        required: true
        default: "next"
        type: string
      tts_backend:
        description: "محرك الصوت"
        required: true
        default: fish
        type: choice
        options:
          - fish

permissions:
  contents: write

concurrency:
  group: story-bot-draft-builder
  cancel-in-progress: false

jobs:
  build-draft:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[produce-episode]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.11'
      - name: Check for a complete eligible episode (no paid generation)
        id: preflight
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('content/series/real_stories.json').read_text(encoding='utf-8'))
          eligible = []
          for ep in data.get('episodes', []):
              publishers = {s.get('publisher', '').strip().lower() for s in ep.get('sources', []) if s.get('publisher') and s.get('url', '').startswith('https://')}
              script = ep.get('script_path', '')
              if (not ep.get('published') and not ep.get('disabled')
                  and ep.get('content_type', data.get('content_type')) == 'verified_real_story'
                  and len(publishers) >= 2 and script and Path(script).is_file()):
                  eligible.append(ep.get('episode_number'))
          print('Eligible episodes:', eligible)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('ready=' + ('true' if eligible else 'false') + '\\n')
          PY
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy edge-tts requests kaggle fish-audio-sdk pillow arabic-reshaper python-bidi
      - name: Build episode and publish automatically
        if: steps.preflight.outputs.ready == 'true'
        id: build_draft
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          STORY_TARGET_WORDS: '3800'
          HISTORY_PATH: content/published_stories.json
          SERIES_MANIFEST_PATH: content/series/real_stories.json
          GROWTH_POLICY_PATH: content/strategy/growth_policy.json
          EPISODE_NUMBER: ${{ inputs.episode_number || 'next' }}
          EPISODE_MODE: verified_real_story
          TTS_BACKEND: fish
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '0'
          ALLOW_UNREVIEWED_PUBLISH: 'true'
        run: python story_youtube_uploader.py
      - name: Persist episode history to prevent repeats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/series/real_stories.json content/drafts/fictional_episodes.json
          if git diff --cached --quiet; then
            echo "No episode history changes to persist."
          else
            git commit -m "chore: persist published episode history"
            git pull --rebase origin main
            git push
          fi
      - name: Save generated and published artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-story-output-${{ github.run_id }}
          path: |
            story.mp4
            story.mp3
            story_metadata.json
            upload_state.json
          if-no-files-found: ignore
          retention-days: 7
