name: Story Bot - Series Publisher
on:
  # أربع خانات يومية ثابتة وفق سياسة النمو الحالية؛ اختيار الحلقة دوري وغير عشوائي.
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'رقم الحلقة الموثقة من content/series/real_stories.json'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      tts_backend:
        description: 'محرك الصوت: edge مجاني، أو xtts بصوتك، أو fish'
        required: true
        default: edge
        type: choice
        options:
          - edge
          - xtts
          - fish
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy edge-tts requests kaggle fish-audio-sdk
      - name: Install XTTS backend
        if: ${{ (inputs.tts_backend || 'edge') == 'xtts' }}
        run: pip install coqui-tts soundfile
      - name: Decode private voice reference
        if: ${{ (inputs.tts_backend || 'edge') == 'xtts' }}
        env:
          VOICE_REFERENCE_B64: ${{ secrets.VOICE_REFERENCE_B64 }}
        run: |
          test -n "$VOICE_REFERENCE_B64"
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > voice_reference.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice_reference.wav
      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          SERIES_MANIFEST_PATH: content/series/real_stories.json
          GROWTH_POLICY_PATH: content/strategy/growth_policy.json
          EPISODE_NUMBER: ${{ inputs.episode_number || '1' }}
          TTS_BACKEND: ${{ inputs.tts_backend || 'edge' }}
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '0'
        run: python story_youtube_uploader.py
      - name: Verify generated video exists
        if: always()
        run: test -f story.mp4 && ls -lh story.mp4
      - name: Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: story-${{ github.run_id }}
          path: |
            story.mp4
            story_metadata.json
            upload_state.json
            content/series/real_stories.json
          if-no-files-found: ignore
          retention-days: 90
