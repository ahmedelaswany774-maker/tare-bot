name: Story Bot - Series Publisher

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'رقم الحلقة الموثقة، أو next لاختيار أول حلقة غير منشورة'
        required: false
        default: next
        type: string
      tts_backend:
        description: 'محرك الصوت: edge مجاني، أو xtts بصوتك، أو fish'
        required: false
        default: edge
        type: choice
        options:
          - edge
          - xtts
          - fish
      publish_short:
        description: 'نشر الـShort المرتبط بعد تجهيز الفيديو الطويل'
        required: false
        default: true
        type: boolean

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af684
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy edge-tts requests kaggle fish-audio-sdk
      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          SERIES_MANIFEST_PATH: content/series/real_stories_season_2.json
          GROWTH_POLICY_PATH: content/strategy/growth_policy.json
          EPISODE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.episode_number || 'next' }}
          TTS_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.tts_backend || 'edge' }}
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '30'
        run: yes y | python story_youtube_uploader.py
      - name: Publish linked Short
        if: ${{ github.event_name == 'schedule' || inputs.publish_short == true }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python short_youtube_uploader.py
      - name: Verify generated video exists
        if: always()
        run: test -f story.mp4 && ls -lh story.mp4
      - name: Save run outputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: story-${{ github.run_id }}
          path: |
            story.mp4
            story_metadata.json
            upload_state.json
            short_state.json
          if-no-files-found: ignore
          retention-days: 7
