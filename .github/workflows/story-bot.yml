name: Story Bot - Series Publisher

on:
  schedule:
    - cron: '0 17 * * 5'
  workflow_dispatch:
    inputs:
      tts_backend:
        description: 'محرك الصوت: edge مجاني، أو xtts بصوتك، أو fish'
        required: false
        default: edge
        type: choice
        options:
          - edge
          - xtts
          - fish
      publish_short:
        description: 'نشر الـShort المرتبط بعد تجهيز الفيديو الطويل'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: story-bot-publisher
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy edge-tts requests kaggle fish-audio-sdk pillow arabic-reshaper python-bidi
      - name: Run bot
        id: run_bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash
          STORY_TARGET_WORDS: '1800'
          HISTORY_PATH: content/published_stories.json
          EPISODE_NUMBER: next
          TTS_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.tts_backend || 'edge' }}
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '30'
        run: yes y | python story_youtube_uploader.py

      - name: Save story history
        if: ${{ always() }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/published_stories.json content/series/real_stories.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: record published story history"
          fi
          # Preserve any other tracked changes made during generation while syncing.
          git stash push -m "preserve generated working-tree changes" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git stash pop || true
          git add content/published_stories.json content/series/real_stories.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: reconcile generated story history"
          fi
          git push

      - name: Publish linked Short
        if: ${{ steps.run_bot.outcome == 'success' && (github.event_name == 'schedule' || inputs.publish_short == true) }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python short_youtube_uploader.py

      - name: Verify generated video exists
        if: always()
        run: test -f story.mp4 && ls -lh story.mp4

      - name: Save run outputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: story-${{ github.run_id }}
          path: |
            story.mp4
            story_metadata.json
            upload_state.json
            short_state.json
          if-no-files-found: ignore
          retention-days: 7
