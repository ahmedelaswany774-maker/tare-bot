name: Story Bot - Episode Video Production and YouTube Publishing
# Owner-requested one-time recovery run after OAuth HTTP-response parser fix (2026-11-26).
# Manual production trigger: this commit intentionally starts the next eligible saved real-story episode.
# Restored to the last proven production path: use saved, reviewed scripts; no Gemini API calls.
# Four daily production slots (Egypt winter time: 10:13, 13:13, 16:13, 19:13; offset from the hour to reduce schedule congestion).
# One approved, sourced episode per run; Fish Audio voice; public YouTube upload.
# A missing approval or incomplete script is a safe skip.

on:
  schedule:
    - cron: '13 8,11,14,17 * * *'
  push:
    branches: [main]
    paths:
      - "content/drafts/**"
      - "content/trigger/**"
  workflow_dispatch:
    inputs:
      episode_mode:
        description: "نوع الإنتاج"
        required: true
        default: verified_real_story
        type: choice
        options:
          - verified_real_story
      episode_number:
        description: "رقم الحلقة داخل السلسلة المختارة"
        required: true
        default: "next"
        type: string
      tts_backend:
        description: "محرك الصوت"
        required: true
        default: fish
        type: choice
        options:
          - fish

permissions:
  contents: write
  issues: write

concurrency:
  group: story-bot-draft-builder
  cancel-in-progress: false

jobs:
  build-draft:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[produce-episode]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-story.txt
      - name: Check for a complete eligible episode (no paid generation)
        id: preflight
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('content/series/real_stories.json').read_text(encoding='utf-8'))
          eligible = []
          blocked = []
          for ep in sorted(data.get('episodes', []), key=lambda item: item.get('episode_number', 0)):
              if ep.get('published') or ep.get('disabled') or ep.get('upload_status') in ('uploading', 'uploaded'):
                  continue
              reasons = []
              if ep.get('content_type', data.get('content_type')) != 'verified_real_story':
                  reasons.append('not_verified_real_story')
              if not ep.get('verified_facts'):
                  reasons.append('missing_verified_facts')
              # Source-count gate intentionally removed per owner request.
              script = ep.get('script_path', '')
              word_count = 0
              if not script or not Path(script).is_file():
                  reasons.append('missing_script_file')
              else:
                  raw = Path(script).read_text(encoding='utf-8')
                  if '# النص الكامل' not in raw or '# ملاحظات المونتاج' not in raw:
                      reasons.append('invalid_script_markers')
                  else:
                      body = raw.split('# النص الكامل', 1)[1].split('# ملاحظات المونتاج', 1)[0]
                      word_count = len(body.split())
                      if word_count < 2400:
                          reasons.append(f'script_too_short_{word_count}_words')
              if reasons:
                  blocked.append((ep.get('episode_number'), reasons))
              else:
                  eligible.append(ep.get('episode_number'))
          print('Eligible episodes:', eligible)
          print('Blocked episodes and reasons:')
          for number, reasons in blocked:
              print(f'  Episode {number}: {", ".join(reasons)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('ready=' + ('true' if eligible else 'false') + chr(10))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Story preflight\n')
              summary.write('Source-count requirement: DISABLED by owner request.\n\n')
              summary.write(f'Eligible episodes: {eligible}\n\n')
              for number, reasons in blocked:
                  summary.write(f'- Episode {number}: {", ".join(reasons)}\n')
          PY
      - name: Skip video production when no approved episode is ready
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo "::notice::No episode meets the production gate (verified facts and a complete 2400+ word script). Rendering and publishing are skipped."
      - name: Validate YouTube OAuth JSON before installing production packages
        id: oauth_payload
        if: steps.preflight.outputs.ready == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os, re, base64
          raw = os.getenv("YT_TOKEN_JSON", "").lstrip("\ufeff").strip()
          if not raw:
              raise SystemExit("YT_TOKEN_JSON is empty; add the complete OAuth JSON response as a repository secret.")
          if raw.lower().startswith("base64:"):
              raw = raw.split(":", 1)[1].strip()
          if not raw.startswith(("{", "[", "`", "HTTP/")):
              try:
                  decoded = base64.b64decode(raw + "=" * (-len(raw) % 4), validate=True).decode("utf-8-sig").strip()
                  if decoded.startswith(("{", "`", "HTTP/")):
                      raw = decoded
              except Exception:
                  pass
          if raw.startswith("HTTP/"):
              match = re.search(r"\r?\n\r?\n", raw)
              if match:
                  raw = raw[match.end():].strip()
          if raw.startswith("```"):
              raw = re.sub(r"\A```(?:json)?\s*|\s*```\Z", "", raw, flags=re.I).strip()
          try:
              info = json.loads(raw)
              if isinstance(info, str):
                  info = json.loads(info)
          except json.JSONDecodeError as first:
              start, end = raw.find("{"), raw.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit(f"YT_TOKEN_JSON is not valid JSON (line {first.lineno}, column {first.colno}); replace it with the complete OAuth JSON body. Secret content was not printed.")
              try:
                  info = json.loads(raw[start:end + 1])
              except json.JSONDecodeError as second:
                  raise SystemExit(f"YT_TOKEN_JSON is malformed JSON (line {second.lineno}, column {second.colno}); replace it with the complete OAuth JSON body. Secret content was not printed.")
          if not isinstance(info, dict):
              raise SystemExit("YT_TOKEN_JSON must be a JSON object, not a plain access token.")
          if not info.get("token") and info.get("access_token"):
              info["token"] = info["access_token"]
          info.setdefault("client_id", os.getenv("YT_CLIENT_ID", "").strip())
          info.setdefault("client_secret", os.getenv("YT_CLIENT_SECRET", "").strip())
          missing = [key for key in ("client_id", "client_secret", "refresh_token", "token") if not info.get(key)]
          if missing:
              raise SystemExit("OAuth JSON is missing: " + ", ".join(missing) + ". Secret content was not printed.")
          print("OAuth JSON structure: PASS (secret values hidden)")
          PY
      - name: Validate Fish Audio and Pexels credentials before installing packages
        if: steps.preflight.outputs.ready == 'true'
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FISH_API_KEY" || { echo "::error::FISH_API_KEY is missing; no production packages or paid API calls were started."; exit 1; }
          test -n "$FISH_VOICE_ID" || { echo "::error::FISH_VOICE_ID is missing; no production packages or paid API calls were started."; exit 1; }
          test -n "$PEXELS_API_KEY" || { echo "::error::PEXELS_API_KEY is missing; no production packages or paid API calls were started."; exit 1; }
      - name: Install cached production dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-story.txt
      - name: Live YouTube OAuth smoke test (before rendering)
        id: oauth_smoke
        if: steps.preflight.outputs.ready == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YOUTUBE_EXPECTED_HANDLE: RowatAlwaqe
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, base64
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          raw = os.environ.get("YT_TOKEN_JSON", "").lstrip("\ufeff").strip()
          if not raw:
              raise SystemExit("YT_TOKEN_JSON is empty; stopping before video rendering.")
          if raw.startswith("HTTP/"):
              match = re.search(r"\r?\n\r?\n", raw)
              if match:
                  raw = raw[match.end():].strip()
          if raw.startswith("```"):
              raw = re.sub(r"\A```(?:json)?\s*|\s*```\Z", "", raw, flags=re.I).strip()
          try:
              info = json.loads(raw)
              if isinstance(info, str):
                  info = json.loads(info)
          except json.JSONDecodeError as first:
              start, end = raw.find("{"), raw.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit(f"YT_TOKEN_JSON is malformed JSON (line {first.lineno}, column {first.colno}); secret content was not printed.")
              try:
                  info = json.loads(raw[start:end + 1])
              except json.JSONDecodeError as second:
                  raise SystemExit(f"YT_TOKEN_JSON is malformed JSON (line {second.lineno}, column {second.colno}); secret content was not printed.")
          if not isinstance(info, dict):
              raise SystemExit("YT_TOKEN_JSON must be a JSON object.")
          if not info.get("token") and info.get("access_token"):
              info["token"] = info["access_token"]
          info.setdefault("token_uri", "https://oauth2.googleapis.com/token")
          if not info.get("scopes") and info.get("scope"):
              info["scopes"] = info["scope"].split()
          missing = [k for k in ("client_id", "client_secret", "refresh_token", "token") if not info.get(k)]
          if missing:
              raise SystemExit("OAuth data incomplete (" + ", ".join(missing) + "); stopping before rendering.")
          scopes = [
              "https://www.googleapis.com/auth/youtube.upload",
              "https://www.googleapis.com/auth/youtube.readonly",
          ]
          if not info.get("expiry"):
              info["expiry"] = (datetime.now(timezone.utc) - timedelta(seconds=60)).isoformat()
          creds = Credentials.from_authorized_user_info(info, scopes=scopes)
          if creds.expired and creds.refresh_token:
              creds.refresh(Request())
          if not creds.valid:
              raise SystemExit("YouTube OAuth credentials are invalid; stopping before rendering.")
          youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)
          result = youtube.channels().list(part="id,snippet", mine=True, maxResults=1).execute()
          channels = result.get("items", [])
          if not channels:
              raise SystemExit("OAuth connected but no YouTube channel was returned; stopping before rendering.")
          channel = channels[0]
          handle = channel.get("snippet", {}).get("customUrl", "").lstrip("@")
          expected = os.getenv("YOUTUBE_EXPECTED_HANDLE", "RowatAlwaqe").lstrip("@").casefold()
          if not handle or handle.casefold() != expected:
              raise SystemExit("OAuth channel identity did not match the expected channel; stopping before rendering.")
          print("YOUTUBE_OAUTH_SMOKE_TEST=PASS")
          print("YOUTUBE_CHANNEL_ID=" + channel.get("id", "unknown"))
          print("YOUTUBE_CHANNEL_TITLE=" + channel.get("snippet", {}).get("title", "unknown"))
          PY
      - name: Verify or install FFmpeg
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg and ffprobe are already installed; reusing runner binaries."
          else
            echo "Required media tools are missing; installing FFmpeg (including ffprobe)."
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Build episode and publish automatically
        if: steps.preflight.outputs.ready == 'true'
        id: build_draft
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          STORY_TARGET_WORDS: '3800'
          HISTORY_PATH: content/published_stories.json
          SERIES_MANIFEST_PATH: content/series/real_stories.json
          GROWTH_POLICY_PATH: content/strategy/growth_policy.json
          EPISODE_NUMBER: ${{ inputs.episode_number || 'next' }}
          EPISODE_MODE: verified_real_story
          TTS_BACKEND: fish
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '0'
          YOUTUBE_EXPECTED_HANDLE: RowatAlwaqe
        run: python story_youtube_uploader.py
      - name: Persist episode history to prevent repeats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/series/real_stories.json content/drafts/fictional_episodes.json
          if git diff --cached --quiet; then
            echo "No episode history changes to persist."
          else
            git commit -m "chore: persist published episode history"
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Save generated and published artifacts
        if: ${{ always() && steps.build_draft.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-story-output-${{ github.run_id }}
          path: |
            story.mp4
            story.mp3
            story_metadata.json
            upload_state.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Write Story Bot production and upload report
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          OAUTH_JSON_OUTCOME: ${{ steps.oauth_payload.outcome }}
          OAUTH_LIVE_OUTCOME: ${{ steps.oauth_smoke.outcome }}
          BUILD_OUTCOME: ${{ steps.build_draft.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ["## Story Bot — production report", ""]
          for label, key in [
              ("Script preflight", "PREFLIGHT_OUTCOME"),
              ("OAuth JSON validation", "OAUTH_JSON_OUTCOME"),
              ("Live YouTube channel check", "OAUTH_LIVE_OUTCOME"),
              ("Render and upload", "BUILD_OUTCOME"),
          ]:
              lines.append(f"- {label}: **{os.getenv(key, 'not run')}**")
          metadata_path = Path("story_metadata.json")
          state_path = Path("upload_state.json")
          video_path = Path("story.mp4")
          if metadata_path.is_file():
              meta = json.loads(metadata_path.read_text(encoding="utf-8"))
              lines += [
                  f"- Episode: **{meta.get('episode_number', 'unknown')} — {meta.get('title', 'unknown')}**",
                  f"- Script length: **{meta.get('story_word_count', 'unknown')} words**",
                  f"- Target duration: **{meta.get('target_duration_minutes', 'unknown')} minutes**",
                  f"- Voice engine: **{meta.get('tts_backend', 'unknown')}**",
                  f"- Sources attached: **{len(meta.get('sources', []))}**",
              ]
          if video_path.is_file():
              lines.append(f"- Rendered MP4: **{video_path.stat().st_size / 1048576:.2f} MB**")
          if state_path.is_file():
              state = json.loads(state_path.read_text(encoding="utf-8"))
              lines += [
                  f"- YouTube verification: **{state.get('verification', state.get('status', 'unknown'))}**",
                  f"- Video ID: **{state.get('youtube_video_id', 'unknown')}**",
                  f"- URL: {state.get('youtube_url', 'not available')}",
                  f"- Privacy: **{state.get('privacy_status', 'unknown')}**",
              ]
          else:
              lines.append("- YouTube upload: **not confirmed in this run**")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Notify owner through a deduplicated GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[Factory Alert] Story Bot production failure"
          existing="$(gh issue list --state open --search "in:title [Factory Alert] Story Bot production failure" --json number --jq '.[0].number // empty')"
          body="$(printf 'The automated production workflow failed.\n\nRun: %s\n\nThis issue is updated instead of creating a new alert for every retry.' "$RUN_URL")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
