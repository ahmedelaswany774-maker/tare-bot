name: Story Bot - Series Publisher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tts_backend:
        description: 'ظ…ط­ط±ظƒ ط§ظ„طµظˆطھ: edge ظ…ط¬ط§ظ†ظٹطŒ ط£ظˆ xtts ط¨طµظˆطھظƒطŒ ط£ظˆ fish'
        required: false
        default: edge
        type: choice
        options:
          - edge
          - xtts
          - fish
      publish_short:
        description: 'ظ†ط´ط± ط§ظ„ظ€Short ط§ظ„ظ…ط±طھط¨ط· ط¨ط¹ط¯ طھط¬ظ‡ظٹط² ط§ظ„ظپظٹط¯ظٹظˆ ط§ظ„ط·ظˆظٹظ„'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: story-bot-publisher
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy edge-tts requests kaggle fish-audio-sdk
      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash
          STORY_TARGET_WORDS: '2500'
          HISTORY_PATH: content/published_stories.json
          TTS_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.tts_backend || 'edge' }}
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '30'
        run: yes y | python story_youtube_uploader.py

      - name: Save story history
        if: ${{ always() }}
        run: |
          if [ -f content/published_stories.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/published_stories.json
            if git diff --cached --quiet; then
              echo "No story history change"
            else
              git commit -m "chore: record published story"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          else
            echo "No story history file yet"
          fi

      - name: Publish linked Short
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publish_short == true) }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python short_youtube_uploader.py

      - name: Verify generated video exists
        if: always()
        run: test -f story.mp4 && ls -lh story.mp4

      - name: Save run outputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: story-${{ github.run_id }}
          path: |
            story.mp4
            story_metadata.json
            upload_state.json
            short_state.json
          if-no-files-found: ignore
          retention-days: 7
