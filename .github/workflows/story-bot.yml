name: Story Bot - Social Stories Draft Builder

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: "رقم الحلقة الموثقة المطلوب تجهيزها ونشرها"
        required: true
        default: "36"
        type: string
      tts_backend:
        description: "محرك الصوت"
        required: true
        default: edge
        type: choice
        options:
          - edge
          - xtts
          - fish

permissions:
  contents: read

concurrency:
  group: story-bot-draft-builder
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib moviepy edge-tts requests kaggle fish-audio-sdk pillow arabic-reshaper python-bidi
      - name: Build episode and publish automatically
        id: build_draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash
          STORY_TARGET_WORDS: '1800'
          HISTORY_PATH: content/published_stories.json
          SERIES_MANIFEST_PATH: content/series/real_stories.json
          GROWTH_POLICY_PATH: content/strategy/growth_policy.json
          EPISODE_NUMBER: ${{ inputs.episode_number }}
          TTS_BACKEND: ${{ inputs.tts_backend }}
          VOICE_REFERENCE_PATH: voice_reference.wav
          XTTS_LANGUAGE: ar
          PUBLISH_DELAY_MINUTES: '30'
          ALLOW_UNREVIEWED_PUBLISH: 'true'
        run: python story_youtube_uploader.py
      - name: Save generated and published artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-story-output-${{ github.run_id }}
          path: |
            story.mp4
            story.mp3
            story_metadata.json
            upload_state.json
          if-no-files-found: ignore
          retention-days: 7
