name: Recover YouTube Upload

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional failed workflow run ID whose story-${run_id} artifact should be recovered"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download failed run artifact when requested
        if: ${{ inputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p recovery
          gh run download "$RUN_ID" -n "story-$RUN_ID" -D recovery
          test -s recovery/story.mp4
          if [ -f recovery/story_metadata.json ]; then cp recovery/story_metadata.json story_metadata.json; fi
          cp recovery/story.mp4 story.mp4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install YouTube dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Resume upload without regenerating video
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python resume_youtube_upload.py

      - name: Save recovery state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-state
          path: |
            story.mp4
            story_metadata.json
            upload_state.json
          if-no-files-found: ignore
          retention-days: 30
