name: Draft 28 Weekly Social Stories

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: weekly-social-story-drafts
  cancel-in-progress: false

jobs:
  draft:
    if: ${{ contains(github.event.head_commit.message, '[draft-weekly-scripts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Generate all 28 full scripts (no YouTube publishing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          STORY_TARGET_WORDS: '3200'
          MIN_SCRIPT_WORDS: '2400'
        run: python scripts/draft_weekly_episodes.py
      - name: Commit generated scripts and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/drafts/verified_real content/series/real_stories.json
          git commit -m "content: save 28 complete weekly social story scripts"
          git push
