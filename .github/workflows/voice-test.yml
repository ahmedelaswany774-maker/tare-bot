name: Voice Test - XTTS Only
on:
  workflow_dispatch:
    inputs:
      language:
        description: 'لغة عينة الاختبار'
        required: true
        default: ar
        type: choice
        options:
          - ar
jobs:
  voice-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install XTTS dependencies
        run: pip install torch torchaudio torchcodec 'transformers==4.57.1' coqui-tts soundfile
      - name: Decode private voice reference
        env:
          VOICE_REFERENCE_B64: ${{ secrets.VOICE_REFERENCE_B64 }}
        run: |
          test -n "$VOICE_REFERENCE_B64"
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > voice_reference.ogg
          ffmpeg -y -i voice_reference.ogg -ac 1 -ar 24000 -c:a pcm_s16le voice_reference.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice_reference.wav
      - name: Generate XTTS sample only
        run: python scripts/test_xtts_voice.py
      - name: Validate generated sample
        run: ffprobe -v error -show_entries format=duration,size -of default=nw=1 voice_test_output.wav
      - name: Upload voice sample artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xtts-voice-test-${{ github.run_id }}
          path: voice_test_output.wav
          retention-days: 7
