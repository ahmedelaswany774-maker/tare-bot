name: Audiobook Video - render and publish one story
# Manual only. Renders a long Egyptian-Arabic audio-novel video from a story text (free edge-tts voice, generated scenes, ffmpeg)
# and publishes it to the channel that YT_TOKEN_JSON belongs to. No video files are committed.
on:
  workflow_dispatch:
    inputs:
      story:
        description: "story config under audiobook/ (without .json)"
        required: true
        default: talhama
        type: string
      privacy:
        description: "YouTube privacy"
        required: true
        default: public
        type: choice
        options: [public, unlisted, private]
      dry_run:
        description: "render only, no upload"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
concurrency:
  group: audiobook-video
  cancel-in-progress: false
jobs:
  render-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra libraqm0 libfribidi0
          pip install edge-tts requests pillow numpy google-api-python-client google-auth google-auth-oauthlib
      - name: Render and publish
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          TTS_BACKEND: fish
          PRIVACY: ${{ inputs.privacy }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python audiobook/make_video.py "audiobook/${{ inputs.story }}.json"
